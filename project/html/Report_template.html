<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astra Report</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      @page {
        size: A4;
        margin: 20mm;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #eef2f7;
        margin: 0;
        padding: 0;
        text-align: center;
        width: 100%;
        height: 100%;
      }

      .container {
        width: 100%;
        max-width: 800px;
        margin: 40px auto;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #aeb8b833;
        padding: 15px;
        border-radius: 12px;
        color: white;
        margin-bottom: 20px;
      }

      .header img {
        height: 50px;
        margin-right: 20px;
      }

      h1 {
        color: black;
        font-size: 26px;
        margin: 0;
        font-weight: bold;
      }

      h2 {
        color: #34495e;
        font-size: 20px;
        margin-top: 20px;
        border-bottom: 2px solid #3a6ea5;
        display: inline-block;
        padding-bottom: 5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border: 1px solid #ddd;
      }

      th {
        background-color: #3a6ea5;
        color: white;
      }

      .chart-container {
        width: 350px;
        height: 350px;
        margin: 20px auto;
      }

      .footer {
        margin-top: 40px;
        font-size: 14px;
        color: #777;
        padding-top: 20px;
        border-top: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header Section with Logo -->
      <div class="header">
        <img
          src="file:///home/zouari_omar/Documents/Daily/Projects/Astra/doc/imgs/logo.png"
          alt="Astra Logo"
        />
        <h1>Astra Report</h1>
      </div>

      <p><b>Generated on:</b> {{GENERATED_DATE}}</p>
      <p><b>Generated By:</b> {{GENERATED_BY}}</p>

      <h2>Employees Department Overview</h2>
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
        <img id="pieChartImg" style="display: none" />
      </div>

      <h2>Employees Status Overview</h2>
      <div class="chart-container">
        <canvas id="barChart"></canvas>
        <img id="barChartImg" style="display: none" />
      </div>

      <h2>Employee Salary Overview</h2>
      <div class="chart-container">
        <canvas id="lineChart"></canvas>
        <img id="lineChartImg" style="display: none" />
      </div>

      <h2>Employee Performance Overview</h2>
      <div class="chart-container">
        <canvas id="radarChart"></canvas>
        <img id="radarChartImg" style="display: none" />
      </div>

      <div class="footer">
        <p>For inquiries, contact: <b>Astra999@gmail.com</b></p>
        <p>&copy; 2025 Astra. All Rights Reserved.</p>
      </div>
    </div>

    <script>
      function generateCharts() {
        const Commercial = "{{COMMERCIAL_VALUE}}";
        const Shops = "{{SHOPS_VALUE}}";
        const Partners = "{{EVENTS_VALUE}}";
        const Events = "{{PARTNERS_VALUE}}";
        const Personals = "{{PERSONALS_VALUE}}";
        const Employees = "{{EMPLOYEES_VALUE}}";
        const ctx1 = document
          .getElementById("pieChart")
          .getContext("2d", { willReadFrequently: true });
        new Chart(ctx1, {
          type: "pie",
          data: {
            labels: [
              "Commercial (" + parseFloat(Commercial).toFixed(2) + "%)",
              "Shops (" + parseFloat(Shops).toFixed(2) + "%)",
              "Partners (" + parseFloat(Partners).toFixed(2) + "%)",
              "Events (" + parseFloat(Events).toFixed(2) + "%)",
              "Personals (" + parseFloat(Personals).toFixed(2) + "%)",
              "Employees (" + parseFloat(Employees).toFixed(2) + "%)",
            ],
            datasets: [
              {
                data: [
                  parseFloat(Commercial),
                  parseFloat(Shops),
                  parseFloat(Partners),
                  parseFloat(Events),
                  parseFloat(Personals),
                  parseFloat(Employees),
                ],
                backgroundColor: [
                  "#3498db",
                  "#f39c12",
                  "#2ecc71",
                  "#e74c3c",
                  "#8e44ad",
                  "#2c3e50",
                ],
              },
            ],
          },
          options: {
            animation: false,
            plugins: {
              legend: {
                display: true,
              },
            },
          },
        });

        var Active = "{{ACTIVE_VALUE}}";
        var Inactive = "{{INACTIVE_VALUE}}";
        var Suspended = "{{SUSPENDED_VALUE}}";
        const ctx2 = document
          .getElementById("barChart")
          .getContext("2d", { willReadFrequently: true });
        new Chart(ctx2, {
          type: "bar",
          data: {
            labels: ["Active", "Inactive", "Suspended"],
            datasets: [
              {
                data: [
                  parseInt(Active),
                  parseInt(Inactive),
                  parseInt(Suspended),
                ],
                backgroundColor: ["#2ecc71", "#f1c40f", "#e74c3c"],
              },
            ],
          },
          options: {
            animation: false,
            plugins: {
              legend: {
                display: false,
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  stepSize: 1,
                },
              },
            },
          },
        });

        const ctx3 = document
          .getElementById("lineChart")
          .getContext("2d", { willReadFrequently: true });
        new Chart(ctx3, {
          type: "line",
          data: {
            labels: ["Q1", "Q2", "Q3", "Q4"],
            datasets: [
              {
                data: [5000, 7000, 8000, 6500],
                borderColor: "#2ecc71",
                fill: false,
              },
            ],
          },
          options: {
            animation: false,
          },
        });

        const ctx4 = document
          .getElementById("radarChart")
          .getContext("2d", { willReadFrequently: true });
        new Chart(ctx4, {
          type: "radar",
          data: {
            labels: [
              "Quality",
              "Speed",
              "Collaboration",
              "Creativity",
              "Discipline",
            ],
            datasets: [
              {
                data: [4, 3, 5, 4, 3],
                backgroundColor: "rgba(41, 128, 185, 0.2)",
                borderColor: "#2980b9",
                borderWidth: 1,
              },
            ],
          },
          options: {
            animation: false,
          },
        });
      }

      function replaceChartsWithImages() {
        setTimeout(() => {
          const pieCanvas = document.getElementById("pieChart");
          const barCanvas = document.getElementById("barChart");
          const lineCanvas = document.getElementById("lineChart");
          const radarCanvas = document.getElementById("radarChart");

          const pieImg = document.getElementById("pieChartImg");
          const barImg = document.getElementById("barChartImg");
          const lineImg = document.getElementById("lineChartImg");
          const radarImg = document.getElementById("radarChartImg");

          html2canvas(pieCanvas).then((canvas) => {
            pieImg.src = canvas.toDataURL("image/png");
            pieImg.style.display = "block";
            pieCanvas.style.display = "none";
          });

          html2canvas(barCanvas).then((canvas) => {
            barImg.src = canvas.toDataURL("image/png");
            barImg.style.display = "block";
            barCanvas.style.display = "none";
          });

          html2canvas(lineCanvas).then((canvas) => {
            lineImg.src = canvas.toDataURL("image/png");
            lineImg.style.display = "block";
            lineCanvas.style.display = "none";
          });

          html2canvas(radarCanvas).then((canvas) => {
            radarImg.src = canvas.toDataURL("image/png");
            radarImg.style.display = "block";
            radarCanvas.style.display = "none";
          });
        }, 500);
      }

      window.onload = () => {
        generateCharts();
        replaceChartsWithImages();
      };
    </script>
  </body>
</html>
